<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="158" viewBox="0 0 1040 158" role="img" aria-labelledby="title desc">
  <title id="title">A studio article, from draft to reader</title>
  <desc id="desc">Three stations: edit in Admin Blogs, mark the article published, then read it in the Library or blog archive.</desc>
  <style>
    .label{font:12px monospace;letter-spacing:2px;fill:#c4cbbb}.station{font:24px Georgia,serif;fill:#f7f0df}
    @media(prefers-reduced-motion:no-preference){.flow{animation:ink 4s linear infinite}}
    @keyframes ink{to{stroke-dashoffset:-64}}
  </style>
  <rect width="1040" height="158" rx="3" fill="#203028"/>
  <path d="M49 59H991" stroke="#637267" fill="none"/>
  <path class="flow" d="M49 59H991" stroke="#f7a26d" stroke-width="2" stroke-dasharray="4 60" fill="none"/>
  <g fill="#f7a26d" stroke="#203028" stroke-width="5"><circle cx="49" cy="59" r="8"/><circle cx="410" cy="59" r="8"/><circle cx="746" cy="59" r="8"/></g>
  <g class="label"><text x="42" y="34">01 / WRITE</text><text x="403" y="34">02 / PUBLISH</text><text x="739" y="34">03 / DISCOVER</text></g>
  <g class="station"><text x="42" y="108">Studio editor</text><text x="403" y="108">Published article</text><text x="739" y="108">Library &amp; archive</text></g>
  <path d="M42 132h26m335 0h26m310 0h26" fill="none" stroke="#f7a26d"/>
</svg>
